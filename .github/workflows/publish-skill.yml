name: Publish FDS Skill

# What reaches npm must have passed what CI runs.
#
# It had not. The only gate between this package and the registry was
# `npm pack --dry-run`, which asserts nothing: it lists the files that would be
# included and exits zero whatever they contain. Meanwhile ci.yml runs two
# checks that read this package specifically — `check:skill` and
# `check:versions` — and publishing ran neither.
#
# That is the wrong way round for this package in particular. The skill is a
# knowledge base an assistant answers from, so a wrong field name in it does not
# produce an error, it produces confident, specific, invalid output that the
# person asking has no way to tell from the truth. Publishing freezes that into
# a release.

on:
  push:
    tags:
      - 'fds-skill@*'  # e.g., fds-skill@1.0.0
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  gates:
    name: Validate Package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache: npm` and no install: these checks are plain Node reading the
      # repository, exactly as the schemas job in ci.yml runs them. The root has
      # no lockfile to key a cache on, which is the honest reason as well as the
      # practical one.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every name the knowledge base uses must exist somewhere in the standard
      # — as a property, a definition, a `const`, an enum member or a
      # recommended value — and every schema URL it quotes must resolve to a
      # published file.
      # check:skill validates the skill's shipped examples against their
      # schemas, so it needs Ajv. The schemas job in ci.yml installs it a step
      # earlier for a different check; this workflow has no such step, so the
      # dependency was satisfied there by accident and absent here. Install it
      # where it is used.
      - name: Install Ajv
        run: npm install --no-save ajv@8 ajv-formats@3

      - name: Verify the skill names fields that exist
        run: npm run check:skill

      # The skill quotes versions, and every version fact outside
      # specification/releases.json is a second copy of a number nobody
      # rechecks. Publishing is exactly when a stale one stops being fixable.
      - name: Verify every version claim matches the release manifest
        run: npm run check:versions

  publish:
    name: Publish to npm
    needs: gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-skill
    # No `environment:`. npm trusted publishing keys the OIDC identity on the
    # repository, the workflow filename and — if the npm side names one — the
    # environment, and an `environment` claim in the token where npm expects none
    # is refused like any other mismatch. Declaring `environment: npm` here was
    # removed on the belief that npm expects none; that belief is about a setting
    # on npmjs.org which cannot be read from this repository, so treat it as
    # unconfirmed. The credential check below prints the four fields to compare
    # against it. Publishing to a GitHub environment is only worth reinstating
    # alongside an environment on the npm side — and a protection rule to justify
    # it, which the `npm` environment did not have.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately before setup-node. With `cache: npm` and a
      # cache-dependency-path that resolves to nothing, setup-node fails with
      # "Some specified paths were not resolved, unable to cache dependencies"
      # — true, and useless to whoever has to act on it. This says what is
      # missing and the one command that produces it.
      #
      # As of writing there is no packages/fds-skill/package-lock.json, so this
      # step fails and nothing publishes. That is the intended state: the
      # package declares no dependencies today, so a lockfile costs nothing and
      # protects the day it declares one — the day `npm install` would quietly
      # float a transitive dependency into a published release.
      - name: The package has a lockfile
        run: |
          # shellcheck disable=SC2016  # the backticks are markdown, not a subshell
          if [ ! -f package-lock.json ]; then
            echo '::error::packages/fds-skill/package-lock.json is missing. Publishing installs with `npm ci` so the published tree is the checked tree; `npm install` would resolve dependencies afresh at publish time. Create it with `cd packages/fds-skill && npm install --package-lock-only` and commit it.'
            exit 1
          fi

      # No `registry-url:`. It reads as "publish to npmjs.org", which this package
      # already does — `publishConfig.registry` in its package.json says so — but
      # actions/setup-node@v4 treats it as an authentication setting. It writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temporary
      # npmrc and exports `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` when the
      # workflow provides none of its own (src/authutil.ts; the placeholder is
      # gone from setup-node's main branch but present in every v4). This job
      # provides none, so npm ran holding a placeholder credential.
      #
      # That did not stop the OIDC exchange — npm attempts it whatever is
      # configured, and overwrites the credential on success (lib/utils/oidc.js).
      # It hid the exchange having failed. `npm publish` reports ENEEDAUTH, "this
      # command requires you to be logged in", only when it finds no credential at
      # all; holding the placeholder it went ahead, PUT the tarball with a token
      # that authenticates as nobody, and the registry answered 404 — the same 404
      # it returns for a package that does not exist, so that an anonymous caller
      # cannot probe which ones do. Five attempts read that as a package problem.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/fds-skill/package-lock.json

      # This job authenticates by trusted publishing — no token, an OIDC
      # exchange the npm CLI performs automatically at `npm publish`. That
      # exchange landed in npm 11.5.1 (2025-07-24); every earlier npm has no
      # lib/utils/oidc.js at all and never attempts it. Node 20 ships npm 10.8.2
      # and Node 22 ships npm 10.9.x, both older, so `node-version: 20` alone
      # leaves the CLI with no way to obtain a publish credential and the write
      # is refused. `--provenance` still succeeds either way, because Sigstore
      # signs from the id-token directly and never touches the registry
      # exchange — which is why the log shows a signature landing and the write
      # failing right after it, and why that pairing is not evidence about
      # authentication one way or the other. Install an npm new enough to do the
      # exchange before publishing.
      #
      # Pinned to the 11 line, not `@latest`. `@latest` is npm 12, whose engines
      # field is `^22.22.2 || ^24.15.0 || >=26.0.0`, so on this runner's Node
      # 20.20.0 the install itself fails EBADENGINE and the job dies before
      # `npm publish` is ever reached — the upgrade meant to supply a working npm
      # could not run on the Node it was being installed under. `npm@11` resolves
      # to 11.19.0, whose engines are `^20.17.0 || >=22.9.0`: new enough for the
      # trusted-publishing exchange, and installable here. Raising `node-version`
      # would also work and Node 20 is deprecated on runners, but that is a
      # separate change with its own exposure — several gates in this repository
      # compare recorded output whose wording is V8-version dependent.
      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: npm pack --dry-run

      # The packaging rules the list below cannot state: that the tarball
      # carries the MIT text it declares, that every entry point resolves and
      # names something Node can load — `main` was `./SKILL.md`, so importing
      # this package threw inside the consumer's loader — and that no shipped
      # document points at a path only this checkout has. `CLAUDE.md` shipped
      # with nineteen of those.
      - name: Verify the package contains what it claims
        working-directory: .
        run: |
          node scripts/check-packages.mjs --self-test
          node scripts/check-packages.mjs fds-skill

      # `files` lists directories, and npm packs a listed path that does not
      # exist without failing. This package *is* its files — a tarball missing
      # knowledge/ or prompts/ installs cleanly and teaches nothing.
      - name: The tarball contains the skill it claims to
        run: |
          set -euo pipefail
          # Pack into an empty directory and find the tarball there, rather than
          # reading npm's stdout. `prepack` runs the build, and the builder
          # writes to stdout too, so the "filename" came back with a build log
          # attached to it. `--silent` quiets npm and has no say over what a
          # lifecycle script prints.
          dest="$RUNNER_TEMP/pack"
          rm -rf "$dest" && mkdir -p "$dest"
          npm pack --pack-destination "$dest" >/dev/null
          tarball="$(find "$dest" -maxdepth 1 -name '*.tgz')"
          [ -f "$tarball" ] || { echo "::error::npm pack produced no tarball in $dest"; exit 1; }
          tar -tzf "$tarball" | sort > "$RUNNER_TEMP/contents"
          sed 's/^/  /' "$RUNNER_TEMP/contents"

          missing=0
          for required in package/SKILL.md \
                          package/knowledge/schemas.md \
                          package/knowledge/mappings.md \
                          package/knowledge/enrichment.md \
                          package/prompts/exercise-classification.md; do
            grep -qx "$required" "$RUNNER_TEMP/contents" || {
              echo "::error::$required is missing from the tarball."
              missing=1
            }
          done
          [ "$missing" -eq 0 ]

      - name: Extract version from tag
        if: github.event_name == 'push'
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/fds-skill@}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $TAG"

      - name: Verify version matches package.json
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # The one property every gate above is incapable of testing: that this job
      # can authenticate. They pack the tarball, open it and read what is inside —
      # none of them needs a credential — and `dry_run: true` skipped the only
      # step that does. So five publishes failed on the same authentication error
      # with every gate green, and the dry run that was meant to de-risk them
      # could not have caught it.
      #
      # This runs on both paths, which is the point: a dry run now proves the
      # credential as well as the contents. See scripts/check-publish-auth.mjs for
      # what it does and why one probe is not enough.
      - name: The publish can authenticate
        working-directory: .
        run: |
          node scripts/check-publish-auth.mjs --self-test
          node scripts/check-publish-auth.mjs packages/fds-skill

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance

      # The contents were already listed and asserted above, on both paths — and
      # since the step above, so has the credential the publish would have used.
      - name: Dry run - skip publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run mode - skipping npm publish"
