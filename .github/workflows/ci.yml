name: CI

on:
  push:
    branches: [main]
  # Any pull request, not only those targeting main. A stacked PR onto another
  # feature branch is still a change that needs checking, and restricting the
  # trigger meant the ones most likely to conflict were the ones with no run.
  pull_request:
  # Manual trigger. When Actions is degraded no run is created at all, so there
  # is nothing to re-run — without this the only way to retry is an empty commit.
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transformer:
    name: Transformer — typecheck, test, build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-transformer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/fds-transformer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # Every packaging defect this repository shipped was invisible to the ten
      # checks in the job below, because all of them read the repository and a
      # package is not its repository. This one packs both tarballs and opens
      # them: the licence text is present, every declared entry point resolves
      # and loads, no shipped document points at a path only this checkout has,
      # and — the behavioural one — the packed transformer resolves every
      # release the manifest names with `fetch` disabled.
      #
      # Here rather than in the schemas job because packing runs `prepack`,
      # which needs the dependencies and the build this job already has. It
      # covers the skill too; that half needs neither.
      - name: Verify the packages contain what they claim
        working-directory: .
        run: npm run check:packages

  schemas:
    name: Schemas — validate examples
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # specification/schemas/ is generated from specification/schema-sources/.
      # Rebuilding and diffing catches both a hand-edit to a published schema and
      # a source change committed without rebuilding — either would let the two
      # drift apart silently. No dependencies: the build is plain Node.
      - name: Verify published schemas match their authoring sources
        run: npm run check:schemas

      # The schema decides which metric values exist; the guide decides which
      # pairings mean anything. Extending the enum without touching the guide
      # leaves a value that validates but has no documented unit.
      - name: Verify the metrics guide covers the vocabulary
        run: npm run check:metrics

      # Nine checks were green while the landing page shipped an exercise with
      # no metrics, no classification.force and no categoryId on any muscle.
      # They all read schemas, sources or fixtures; none read the JSON on the
      # page. The script proves itself against that recovered document before it
      # judges anything, so a run that passes has also failed on purpose. Ajv is
      # installed here rather than reused from the step below because this runs
      # before it.
      - name: Verify every documented example validates against its schema
        run: |
          npm install --no-save ajv@8 ajv-formats@3
          npm run check:doc-examples

      # The mapping schema closes `additionalProperties`, which is a promise that
      # it lists every key the transformer reads. It stopped being true: the tool
      # grew six keys, documented all six, and none of them validated. Nothing
      # read the schema and the implementation together. This does. Ajv comes
      # from the step above, which runs in the same job.
      - name: Verify the mapping schema names what the transformer reads
        run: npm run check:mapping

      # Every check in this job reads something. None of them ran the
      # transformer and asked whether what came out validates — and two
      # committed configurations had been writing a media type no schema allows,
      # stamped with a withdrawn version, since the day they were written. This
      # takes the deterministic fixture through the built CLI and validates the
      # result against the published schema each document declares, then reads
      # every committed mapping configuration — including the ones that need an
      # API key and so cannot be run — for constants their schema rejects.
      #
      # Builds the CLI here because jobs do not share a filesystem; the
      # transformer job's build is not available to this one. Ajv comes from the
      # doc-examples step above, which runs in the same job.
      - name: Verify the transformer produces valid FDS
        run: |
          npm --prefix packages/fds-transformer ci
          npm --prefix packages/fds-transformer run build
          npm run check:transform

      # An RFC that promises a field the schema rejects, or a schema that carries
      # one no RFC explains, has shipped here twice. Nothing read both until now.
      - name: Verify RFCs and their schemas agree
        run: npm run check:rfc

      # The specification lives twice — the source under specification/rfc/ and
      # the page readers actually get. Editing a normative rule in one and not
      # the other leaves the published copy stating the old rule, silently.
      - name: Verify website pages match their sources
        run: npm run check:mirrors

      # "No scenario without an example ships" is a promise about a list of
      # training structures, and a list is exactly what quietly falls out of date.
      - name: Verify every matrix scenario has a worked example
        run: npm run check:scenarios

      # `exerciseType` carries no enum and no examples — the registry is the only
      # place its vocabulary is written down, which makes it load-bearing.
      - name: Verify recommended values are in a registry
        run: npm run check:registries

      # The skill is a knowledge base an assistant answers from, so a wrong field
      # name there produces confident, specific, invalid output.
      - name: Verify the skill names fields that exist
        run: npm run check:skill

      # Every version fact outside specification/releases.json is a second copy
      # of a number nobody rechecks: a navbar label, a schema listing, an RFC
      # pointing at the version it just superseded. All of them have drifted.
      - name: Verify every version claim matches the release manifest
        run: npm run check:versions

      - name: Install Ajv CLI
        run: npm install --no-save ajv@8 ajv-cli@5 ajv-formats@3

      # RFC-006 publishes a $defs library, not an entity: its root accepts nothing,
      # so the loop below cannot check it. Each fixture names the definition it
      # exemplifies and is validated against that definition instead.
      - name: Validate prescription fixtures against their definitions
        run: npm run check:prescription

      # Every published example must validate against its schema, standalone.
      #
      # The schemas come from specification/releases.json, which is generated
      # from one traversal of the published tree. This step used to hard-code
      # seven paths, and so did scripts/ci-local.sh: publishing an eighth entity
      # would have left its examples unvalidated in both, with a green run,
      # because a loop over a shorter list still exits zero. Nothing here names
      # an entity now, so gaining one changes what CI validates on its own.
      #
      # No `-r` reference schemas: each entity schema is self-contained, which is
      # what lets an implementer validate one entity without fetching the others.
      # If a cross-schema `$ref` is ever reintroduced, this job fails — which is
      # the point. It is also what will prove the fds-common dereference output
      # stayed non-breaking.
      - name: Validate all schema examples
        run: |
          set -euo pipefail
          failed=0 total=0

          validate() {
            local schema="$1" dir example
            dir="$(dirname "$schema")"
            for example in "$dir"/*.example*.json; do
              [ -e "$example" ] || continue
              total=$((total + 1))
              printf '→ %-40s ' "$(basename "$example")"
              if npx ajv validate --spec=draft2020 -c ajv-formats \
                   -s "$schema" -d "$example" >/dev/null 2>&1; then
                echo PASS
              else
                echo FAIL
                failed=$((failed + 1))
                npx ajv validate --spec=draft2020 -c ajv-formats \
                  -s "$schema" -d "$example" || true
              fi
            done
          }

          while IFS= read -r schema; do
            [ -n "$schema" ] || continue
            echo "== $schema"
            validate "$schema"
          done < <(node scripts/list-entity-schemas.mjs)

          echo "---- $total examples, $failed failed ----"
          # A loop over an empty list exits zero and reports success — the same
          # silence this step was changed to remove, arriving another way.
          [ "$total" -gt 0 ]
          [ "$failed" -eq 0 ]

  website:
    name: Website — build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
