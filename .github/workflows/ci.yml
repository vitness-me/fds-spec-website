name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. When Actions is degraded no run is created at all, so there
  # is nothing to re-run — without this the only way to retry is an empty commit.
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  transformer:
    name: Transformer — typecheck, test, build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-transformer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/fds-transformer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  schemas:
    name: Schemas — validate examples
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # specification/schemas/ is generated from specification/schema-sources/.
      # Rebuilding and diffing catches both a hand-edit to a published schema and
      # a source change committed without rebuilding — either would let the two
      # drift apart silently. No dependencies: the build is plain Node.
      - name: Verify published schemas match their authoring sources
        run: npm run check:schemas

      # The schema decides which metric values exist; the guide decides which
      # pairings mean anything. Extending the enum without touching the guide
      # leaves a value that validates but has no documented unit.
      - name: Verify the metrics guide covers the vocabulary
        run: npm run check:metrics

      # An RFC that promises a field the schema rejects, or a schema that carries
      # one no RFC explains, has shipped here twice. Nothing read both until now.
      - name: Verify RFCs and their schemas agree
        run: npm run check:rfc

      # "No scenario without an example ships" is a promise about a list of
      # training structures, and a list is exactly what quietly falls out of date.
      - name: Verify every matrix scenario has a worked example
        run: npm run check:scenarios

      - name: Install Ajv CLI
        run: npm install --no-save ajv@8 ajv-cli@5 ajv-formats@3

      # RFC-006 publishes a $defs library, not an entity: its root accepts nothing,
      # so the loop below cannot check it. Each fixture names the definition it
      # exemplifies and is validated against that definition instead.
      - name: Validate prescription fixtures against their definitions
        run: npm run check:prescription

      # Every published example must validate against its schema, standalone.
      #
      # No `-r` reference schemas: each entity schema is self-contained, which is
      # what lets an implementer validate one entity without fetching the others.
      # If a cross-schema `$ref` is ever reintroduced, this job fails — which is
      # the point. It is also what will prove the fds-common dereference output
      # stayed non-breaking.
      - name: Validate all schema examples
        run: |
          set -euo pipefail
          SCHEMAS=specification/schemas
          failed=0 total=0

          validate() {
            local schema="$1" dir="$2" example
            for example in "$dir"/*.example*.json; do
              [ -e "$example" ] || continue
              total=$((total + 1))
              printf '→ %-40s ' "$(basename "$example")"
              if npx ajv validate --spec=draft2020 -c ajv-formats \
                   -s "$schema" -d "$example" >/dev/null 2>&1; then
                echo PASS
              else
                echo FAIL
                failed=$((failed + 1))
                npx ajv validate --spec=draft2020 -c ajv-formats \
                  -s "$schema" -d "$example" || true
              fi
            done
          }

          validate "$SCHEMAS/exercises/v1.1.0/exercise.schema.json"                     "$SCHEMAS/exercises/v1.1.0"
          validate "$SCHEMAS/equipment/v1.1.0/equipment.schema.json"                    "$SCHEMAS/equipment/v1.1.0"
          validate "$SCHEMAS/muscle/v1.0.0/muscle.schema.json"                          "$SCHEMAS/muscle/v1.0.0"
          validate "$SCHEMAS/muscle/muscle-category/v1.0.0/muscle-category.schema.json" "$SCHEMAS/muscle/muscle-category/v1.0.0"
          validate "$SCHEMAS/atlas/v1.0.0/body-atlas.schema.json"                       "$SCHEMAS/atlas/v1.0.0"
          validate "$SCHEMAS/workout/v1.0.0/workout.schema.json"                        "$SCHEMAS/workout/v1.0.0"
          validate "$SCHEMAS/program/v1.0.0/program.schema.json"                        "$SCHEMAS/program/v1.0.0"

          echo "---- $total examples, $failed failed ----"
          [ "$failed" -eq 0 ]

  website:
    name: Website — build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
