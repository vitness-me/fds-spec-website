name: Publish FDS Transformer

# What reaches npm must be what CI tested.
#
# It was not. This workflow installed with `npm install` and keyed its cache on
# package.json, while ci.yml installs with `npm ci` keyed on package-lock.json.
# `npm install` re-resolves every range at install time, so the tree built here
# was whatever the registry offered that morning, and the tree CI tested was the
# locked one. Two different builds, and `--provenance` attested the one nobody
# had run a test against.
#
# Both jobs below now install from the lockfile, so the dependency tree is the
# same in all three places: CI, the gates here, and the published build.

on:
  push:
    tags:
      - 'fds-transformer@*'  # e.g., fds-transformer@0.1.0
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  build-and-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-transformer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # The lockfile, as in ci.yml. Keyed on package.json, the cache key
          # stayed constant while the resolved tree underneath it moved.
          cache-dependency-path: packages/fds-transformer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # The built dist/ used to be uploaded here and downloaded by the publish
      # job, which looked like carrying the tested artifact across but was not:
      # package.json declares `prepublishOnly: npm run build`, so `npm publish`
      # rebuilt over the downloaded files every time. The hand-off was removed
      # rather than repaired, because the property it was faking is delivered
      # properly by both jobs installing the same locked tree — `npm ci` from
      # one package-lock.json produces one dependency tree, so the rebuild in
      # the publish job is the same build, not a second one.

  publish:
    name: Publish to npm
    needs: build-and-test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-transformer
    # No `environment:`. npm trusted publishing keys the OIDC identity on the
    # repository, the workflow filename and — if the npm side names one — the
    # environment, and an `environment` claim in the token where npm expects none
    # is refused like any other mismatch. Declaring `environment: npm` here was
    # removed on the belief that npm expects none; that belief is about a setting
    # on npmjs.org which cannot be read from this repository, so treat it as
    # unconfirmed. The credential check below prints the four fields to compare
    # against it. Publishing to a GitHub environment is only worth reinstating
    # alongside an environment on the npm side — and a protection rule to justify
    # it, which the `npm` environment did not have.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `registry-url:`. It reads as "publish to npmjs.org", which this package
      # already does — `publishConfig.registry` in its package.json says so — but
      # actions/setup-node@v4 treats it as an authentication setting. It writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temporary
      # npmrc and exports `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` when the
      # workflow provides none of its own (src/authutil.ts; the placeholder is
      # gone from setup-node's main branch but present in every v4). This job
      # provides none, so npm ran holding a placeholder credential.
      #
      # That did not stop the OIDC exchange — npm attempts it whatever is
      # configured, and overwrites the credential on success (lib/utils/oidc.js).
      # It hid the exchange having failed. `npm publish` reports ENEEDAUTH, "this
      # command requires you to be logged in", only when it finds no credential at
      # all; holding the placeholder it went ahead, PUT the tarball with a token
      # that authenticates as nobody, and the registry answered 404 — the same 404
      # it returns for a package that does not exist, so that an anonymous caller
      # cannot probe which ones do. Five attempts read that as a package problem.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/fds-transformer/package-lock.json

      # This job authenticates by trusted publishing — no token, an OIDC
      # exchange the npm CLI performs automatically at `npm publish`. That
      # exchange landed in npm 11.5.1 (2025-07-24); every earlier npm has no
      # lib/utils/oidc.js at all and never attempts it. Node 20 ships npm 10.8.2
      # and Node 22 ships npm 10.9.x, both older, so `node-version: 20` alone
      # leaves the CLI with no way to obtain a publish credential and the write
      # is refused. `--provenance` still succeeds either way, because Sigstore
      # signs from the id-token directly and never touches the registry
      # exchange — which is why the log shows a signature landing and the write
      # failing right after it, and why that pairing is not evidence about
      # authentication one way or the other. Install an npm new enough to do the
      # exchange before publishing.
      #
      # Pinned to the 11 line, not `@latest`. `@latest` is npm 12, whose engines
      # field is `^22.22.2 || ^24.15.0 || >=26.0.0`, so on this runner's Node
      # 20.20.0 the install itself fails EBADENGINE and the job dies before
      # `npm publish` is ever reached — the upgrade meant to supply a working npm
      # could not run on the Node it was being installed under. `npm@11` resolves
      # to 11.19.0, whose engines are `^20.17.0 || >=22.9.0`: new enough for the
      # trusted-publishing exchange, and installable here. Raising `node-version`
      # would also work and Node 20 is deprecated on runners, but that is a
      # separate change with its own exposure — several gates in this repository
      # compare recorded output whose wording is V8-version dependent.
      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      # The tarball is opened, and then it is *run*. The list below is a list,
      # with the failure mode a list has: it named four paths and stayed green
      # while `dist/schemas/bundled/` held one release out of five, described in
      # the build as the offline fallback and read by nothing. This step derives
      # what to expect from specification/releases.json and from the package's
      # own manifest, so it cannot fall behind the thing it describes, and it
      # settles the offline claim by disabling `fetch` and asking the packed
      # build to resolve every release.
      - name: Verify the package contains what it claims
        working-directory: .
        run: |
          node scripts/check-packages.mjs --self-test
          node scripts/check-packages.mjs fds-transformer

      # `files` lists dist/, but npm packs happily when a listed path is absent
      # — it mentions it in a notice and exits zero. A package published without
      # its entry point installs without complaint and fails at import, in
      # someone else's build, which is the worst place to learn about it. So the
      # tarball is opened and read.
      - name: The tarball contains the build it claims to
        run: |
          set -euo pipefail
          # Pack into an empty directory and find the tarball there, rather than
          # reading npm's stdout. `prepack` runs the build, and the builder
          # writes to stdout too, so the "filename" came back with a build log
          # attached to it. `--silent` quiets npm and has no say over what a
          # lifecycle script prints.
          dest="$RUNNER_TEMP/pack"
          rm -rf "$dest" && mkdir -p "$dest"
          npm pack --pack-destination "$dest" >/dev/null
          tarball="$(find "$dest" -maxdepth 1 -name '*.tgz')"
          [ -f "$tarball" ] || { echo "::error::npm pack produced no tarball in $dest"; exit 1; }
          tar -tzf "$tarball" | sort > "$RUNNER_TEMP/contents"
          sed 's/^/  /' "$RUNNER_TEMP/contents"

          missing=0
          for required in package/dist/index.js \
                          package/dist/index.d.ts \
                          package/dist/bin/fds-transformer.js \
                          package/schemas/mapping.schema.json; do
            grep -qx "$required" "$RUNNER_TEMP/contents" || {
              echo "::error::$required is missing from the tarball."
              missing=1
            }
          done
          [ "$missing" -eq 0 ]

      - name: Extract version from tag
        if: github.event_name == 'push'
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/fds-transformer@}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $TAG"

      - name: Verify version matches package.json
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # The one property every gate above is incapable of testing: that this job
      # can authenticate. They pack the tarball, open it and run what is inside —
      # none of them needs a credential — and `dry_run: true` skipped the only
      # step that does. So five publishes failed on the same authentication error
      # with every gate green, and the dry run that was meant to de-risk them
      # could not have caught it.
      #
      # This runs on both paths, which is the point: a dry run now proves the
      # credential as well as the contents. See scripts/check-publish-auth.mjs for
      # what it does and why one probe is not enough.
      - name: The publish can authenticate
        working-directory: .
        run: |
          node scripts/check-publish-auth.mjs --self-test
          node scripts/check-publish-auth.mjs packages/fds-transformer

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance

      # The contents were already listed and asserted above, on both paths — and
      # since the step above, so has the credential the publish would have used.
      - name: Dry run - skip publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run mode - skipping npm publish"
