name: Publish FDS Transformer

# What reaches npm must be what CI tested.
#
# It was not. This workflow installed with `npm install` and keyed its cache on
# package.json, while ci.yml installs with `npm ci` keyed on package-lock.json.
# `npm install` re-resolves every range at install time, so the tree built here
# was whatever the registry offered that morning, and the tree CI tested was the
# locked one. Two different builds, and `--provenance` attested the one nobody
# had run a test against.
#
# Both jobs below now install from the lockfile, so the dependency tree is the
# same in all three places: CI, the gates here, and the published build.

on:
  push:
    tags:
      - 'fds-transformer@*'  # e.g., fds-transformer@0.1.0
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  build-and-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-transformer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # The lockfile, as in ci.yml. Keyed on package.json, the cache key
          # stayed constant while the resolved tree underneath it moved.
          cache-dependency-path: packages/fds-transformer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # The built dist/ used to be uploaded here and downloaded by the publish
      # job, which looked like carrying the tested artifact across but was not:
      # package.json declares `prepublishOnly: npm run build`, so `npm publish`
      # rebuilt over the downloaded files every time. The hand-off was removed
      # rather than repaired, because the property it was faking is delivered
      # properly by both jobs installing the same locked tree — `npm ci` from
      # one package-lock.json produces one dependency tree, so the rebuild in
      # the publish job is the same build, not a second one.

  publish:
    name: Publish to npm
    needs: build-and-test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/fds-transformer
    environment:
      name: npm
      url: https://www.npmjs.com/package/@vitness/fds-transformer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/fds-transformer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      # The tarball is opened, and then it is *run*. The list below is a list,
      # with the failure mode a list has: it named four paths and stayed green
      # while `dist/schemas/bundled/` held one release out of five, described in
      # the build as the offline fallback and read by nothing. This step derives
      # what to expect from specification/releases.json and from the package's
      # own manifest, so it cannot fall behind the thing it describes, and it
      # settles the offline claim by disabling `fetch` and asking the packed
      # build to resolve every release.
      - name: Verify the package contains what it claims
        working-directory: .
        run: |
          node scripts/check-packages.mjs --self-test
          node scripts/check-packages.mjs fds-transformer

      # `files` lists dist/, but npm packs happily when a listed path is absent
      # — it mentions it in a notice and exits zero. A package published without
      # its entry point installs without complaint and fails at import, in
      # someone else's build, which is the worst place to learn about it. So the
      # tarball is opened and read.
      - name: The tarball contains the build it claims to
        run: |
          set -euo pipefail
          # Pack into an empty directory and find the tarball there, rather than
          # reading npm's stdout. `prepack` runs the build, and the builder
          # writes to stdout too, so the "filename" came back with a build log
          # attached to it. `--silent` quiets npm and has no say over what a
          # lifecycle script prints.
          dest="$RUNNER_TEMP/pack"
          rm -rf "$dest" && mkdir -p "$dest"
          npm pack --pack-destination "$dest" >/dev/null
          tarball="$(find "$dest" -maxdepth 1 -name '*.tgz')"
          [ -f "$tarball" ] || { echo "::error::npm pack produced no tarball in $dest"; exit 1; }
          tar -tzf "$tarball" | sort > "$RUNNER_TEMP/contents"
          sed 's/^/  /' "$RUNNER_TEMP/contents"

          missing=0
          for required in package/dist/index.js \
                          package/dist/index.d.ts \
                          package/dist/bin/fds-transformer.js \
                          package/schemas/mapping.schema.json; do
            grep -qx "$required" "$RUNNER_TEMP/contents" || {
              echo "::error::$required is missing from the tarball."
              missing=1
            }
          done
          [ "$missing" -eq 0 ]

      - name: Extract version from tag
        if: github.event_name == 'push'
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/fds-transformer@}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $TAG"

      - name: Verify version matches package.json
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance

      # The contents were already listed and asserted above, on both paths.
      - name: Dry run - skip publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run mode - skipping npm publish"
